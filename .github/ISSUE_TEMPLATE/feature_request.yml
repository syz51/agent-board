name: Feature request
description: Propose a new capability or a change in behavior.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/DESIGN.md](https://github.com/syz51/agent-board/blob/main/docs/DESIGN.md)
        first: it records the goals and how the parts fit together.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you'd like, including any API, CLI or MCP tool it touches.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or workarounds you considered.
