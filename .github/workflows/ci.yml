name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job ids are the required status check names on `main`: rename them only together with
# the ruleset.
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      # Only main saves: a pull request's cache is readable by that pull request alone,
      # so saving there only evicts main's entries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      # `packageManager` in web/package.json is the Bun version; the image builds with the
      # same one.
      - name: Check the Dockerfile uses the same Bun
        run: |
          want="$(jq -r '.packageManager | ltrimstr("bun@")' package.json)"
          grep -q "^FROM oven/bun:${want}-" ../Dockerfile \
            || { echo "::error file=Dockerfile::oven/bun is not ${want}, the packageManager in web/package.json"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run check

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: agent-board:ci
          cache-from: type=gha,scope=ci
          # Pull requests read main's layers; only main writes them.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=ci' || '' }}
      - name: Smoke test the image
        run: docker run --rm agent-board:ci --version
