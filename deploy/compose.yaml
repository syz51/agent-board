# Runs the server on the host network, listening on loopback only, so nothing but
# `tailscale serve` on this host can reach it (see docs/DEPLOY.md).
services:
  board:
    build:
      context: ..
      args:
        # Set by the deploy command: BOARD_COMMIT=$(git rev-parse --short=12 HEAD) and
        # BOARD_BUILT=$(git log -1 --format=%ct HEAD), the order stamp.
        BOARD_COMMIT: ${BOARD_COMMIT:-unknown}
        BOARD_BUILT: ${BOARD_BUILT:-unknown}
    image: agent-board:local
    restart: unless-stopped
    network_mode: host
    environment:
      BOARD_LOG: info
    env_file:
      - path: /etc/agent-board/secrets.env
        required: false
    volumes:
      - /etc/agent-board/server.toml:/etc/agent-board/server.toml:ro
      - /var/lib/agent-board:/var/lib/agent-board
