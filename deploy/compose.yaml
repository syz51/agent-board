# Runs the server on the host network, listening on loopback only, so nothing but
# `tailscale serve` on this host can reach it (see docs/DEPLOY.md).
services:
  board:
    build:
      context: ..
      args:
        # Set by the deploy command: BOARD_COMMIT=$(git rev-parse --short=12 HEAD) and
        # BOARD_BUILT=$(git log -1 --format=%ct HEAD), the order stamp.
        BOARD_COMMIT: ${BOARD_COMMIT:-unknown}
        BOARD_BUILT: ${BOARD_BUILT:-unknown}
    image: agent-board:local
    restart: unless-stopped
    network_mode: host
    environment:
      BOARD_LOG: info
    env_file:
      - path: /etc/agent-board/secrets.env
        required: false
    volumes:
      - /etc/agent-board/server.toml:/etc/agent-board/server.toml:ro
      - /var/lib/agent-board:/var/lib/agent-board

  # Optional remote Streamable HTTP MCP + OAuth 2.1 gateway sidecar.
  # Start alongside `board` with `docker compose --profile mcp-http up -d`.
  # Listens on loopback (127.0.0.1:7378) and calls the core server over localhost with a
  # dedicated `--user` device token; publish ONLY its OAuth/MCP routes through a reverse
  # proxy that strips `Tailscale-User-Login` (see docs/DEPLOY.md).
  board-mcp:
    image: agent-board:local
    profiles: ["mcp-http"]
    restart: unless-stopped
    network_mode: host
    command: ["mcp-http", "--config", "/etc/agent-board/mcp-http.toml"]
    environment:
      BOARD_LOG: info
    env_file:
      - path: /etc/agent-board/mcp-secrets.env
        required: true
    volumes:
      - /etc/agent-board/mcp-http.toml:/etc/agent-board/mcp-http.toml:ro
      - /var/lib/agent-board:/var/lib/agent-board
    depends_on:
      - board
