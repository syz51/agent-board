[package]
name = "board"
description = "agent-board client: CLI, MCP server, hooks and device daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "board"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
board-proto.workspace = true
board-server.workspace = true
chrono.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
eventsource-stream = "0.2.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "stream"] }
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "time", "fs", "signal", "sync"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"

[lints]
workspace = true
