[package]
name = "board-server"
description = "agent-board server: storage, rules, HTTP API, snapshots, web assets and notifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
board-proto.workspace = true
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
globset = { version = "0.4.21", default-features = false }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
