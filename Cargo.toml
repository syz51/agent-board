[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/syz51/agent-board"

# Shared by every crate. Crate-specific dependencies go in that crate's own manifest.
[workspace.dependencies]
board-proto = { path = "crates/board-proto" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
